<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Butterfly Dynamix Platform</title>
  <link rel="manifest" href="/site.webmanifest">
  <link rel="shortcut icon" href="/favicon.ico">
</head>
<body>

  <!-- NAVIGATION BAR -->
  <nav class="navbar">
    <div class="nav-brand" onclick="showPage('homePage')">
      <span>🦋 Butterfly Dynamix</span>
    </div>

    <div class="nav-links">
      <a href="javascript:void(0)" onclick="showPage('servicesPage')">Services</a>
      <a href="javascript:void(0)" onclick="showPage('howPage')">How It Works</a>
      <!-- NOTE: Articles link removed from navigation during admin staging -->
    </div>

    <div class="nav-actions">
      <div id="navAvatar" class="nav-avatar" onclick="openMyProfile()">👤</div>
    </div>

    <button id="navHamburger" class="hamburger" onclick="toggleMobileNav()">☰</button>
  </nav>

  <!-- MOBILE NAVIGATION DROPDOWN -->
  <div id="mobileNavDropdown" class="mobile-nav">
    <a href="javascript:void(0)" onclick="showPage('servicesPage'); closeMobileNav();">Services</a>
    <a href="javascript:void(0)" onclick="showPage('howPage'); closeMobileNav();">How It Works</a>
    <!-- NOTE: Articles link removed from mobile navigation -->
  </div>

  <!-- MAIN APP CONTAINER -->
  <main class="app-content">

    <!-- HOME PAGE VIEW -->
    <section id="homePage" class="page active">
      <div id="homeDefaultContent">
        <!-- Main landing hero & content -->
      </div>
      <div id="homeSearchResults" style="display:none;"></div>
    </section>

    <!-- SERVICES PAGE VIEW -->
    <section id="servicesPage" class="page">
      <!-- Services layout and booking form -->
    </section>

    <!-- USER / ADMIN PROFILE PAGE VIEW -->
    <section id="profilePage" class="page">
      <div class="container" style="max-width: 800px; margin: 0 auto; padding: 20px 16px;">
        <!-- Header renders profile info + private articles section for @digitalcatchup -->
        <div id="profileHeader"></div>
        <div id="profileFeed"></div>
      </div>
    </section>

    <!-- ARTICLE DETAIL PAGE VIEW -->
    <section id="articleDetailPage" class="page">
      <div class="container" style="max-width: 800px; margin: 0 auto; padding: 20px 16px;">
        <button class="btn-link" onclick="closeProfile()">← Back</button>
        <div id="articleDetailContent"></div>
      </div>
    </section>

  </main>

  <!-- JS DEPENDENCIES -->
  <script src="/supabase-config.js"></script>
  <script src="/auth.js"></script>
  <script src="/data.js"></script>
  <script src="/app.js"></script>
</body>
</html>
