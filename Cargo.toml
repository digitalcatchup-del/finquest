[package]
name = "stmt_engine"
version = "0.1.0"
edition = "2021"
description = "Bank statement reader for Butterfly Dynamix: words/cells -> verified transactions"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
calamine = { version = "0.37.0", default-features = false, features = ["dates"] }
regex-lite = "0.1.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen = { version = "0.2.129", optional = true }

[features]
wasm = ["dep:wasm-bindgen"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
