name: Build statement engine

on:
  push:
    paths:
      - 'stmt-engine/**'
      - '.github/workflows/build-stmt-engine.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stmt-engine
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: stmt-engine

      - name: Run the engine tests
        run: cargo test --release

      - name: Install the wasm-bindgen tool (same version the crate uses)
        run: |
          V=$(grep -A1 'name = "wasm-bindgen"$' Cargo.lock | grep version | cut -d'"' -f2)
          echo "wasm-bindgen $V"
          cargo install wasm-bindgen-cli --version "$V" --locked

      - name: Build WebAssembly
        run: cargo build --release --lib --target wasm32-unknown-unknown --features wasm

      - name: Create the browser files
        run: |
          rm -rf dist && mkdir dist
          wasm-bindgen --target web --no-typescript --out-dir dist target/wasm32-unknown-unknown/release/stmt_engine.wasm
          ls -la dist

      - name: Shrink the .wasm (optional)
        continue-on-error: true
        run: |
          sudo apt-get install -y binaryen > /dev/null
          wasm-opt -Oz dist/stmt_engine_bg.wasm -o dist/stmt_engine_bg.wasm
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: stmt-engine
          path: stmt-engine/dist

      - name: Save the built files in the repository
        continue-on-error: true
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -f dist
          git diff --cached --quiet || git commit -m "Build statement engine"
          git push
