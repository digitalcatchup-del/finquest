<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Butterfly Dynamix - Business ERP Platform</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary-color: #4361ee;
      --secondary-color: #3f37c9;
      --accent-color: #4cc9f0;
      --success-color: #4ade80;
      --warning-color: #facc15;
      --danger-color: #f87171;
      --dark-color: #1e293b;
      --light-color: #f8fafc;
      --gray-100: #f1f5f9;
      --gray-200: #e2e8f0;
      --gray-300: #cbd5e1;
      --gray-400: #94a3b8;
      --gray-500: #64748b;
      --border-radius: 8px;
      --box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --transition: all 0.3s ease;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f7fa;
      color: var(--dark-color);
      min-height: 100vh;
    }

    .app-container {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 260px;
      background: linear-gradient(180deg, var(--primary-color), var(--secondary-color));
      color: white;
      padding: 20px 0;
      box-shadow: 2px 0 10px rgba(0,0,0,0.1);
      position: fixed;
      height: 100vh;
      overflow-y: auto;
    }

    .logo {
      padding: 0 20px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 20px;
    }

    .logo h1 {
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon { font-size: 1.8rem; }

    .nav-menu { list-style: none; }
    .nav-item { margin-bottom: 5px; }

    .nav-link {
      display: flex;
      align-items: center;
      padding: 12px 20px;
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      transition: var(--transition);
      gap: 12px;
      font-weight: 500;
    }

    .nav-link:hover,
    .nav-link.active {
      background: rgba(255,255,255,0.1);
      color: white;
      border-left: 4px solid var(--accent-color);
    }

    .nav-link i {
      width: 24px;
      text-align: center;
      font-size: 1.2rem;
    }

    .main-content {
      flex: 1;
      margin-left: 260px;
      padding: 20px;
    }

    .top-header {
      background: white;
      padding: 15px 20px;
      border-radius: var(--border-radius);
      box-shadow: var(--box-shadow);
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-title {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--dark-color);
    }

    .user-actions {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .btn {
      padding: 8px 16px;
      border-radius: var(--border-radius);
      border: none;
      cursor: pointer;
      font-weight: 500;
      transition: var(--transition);
      text-decoration: none;
      display: inline-block;
    }

    .btn-sm { padding: 6px 12px; font-size: 0.875rem; }
    .btn-primary { background-color: var(--primary-color); color: white; }
    .btn-primary:hover { background-color: var(--secondary-color); }
    .btn-secondary { background-color: var(--gray-300); color: var(--dark-color); }
    .btn-secondary:hover { background-color: var(--gray-400); }
    .btn-success { background-color: var(--success-color); color: white; }
    .btn-warning { background-color: var(--warning-color); color: var(--dark-color); }
    .btn-danger { background-color: var(--danger-color); color: white; }

    .dash-grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      border-radius: var(--border-radius);
      box-shadow: var(--box-shadow);
      padding: 20px;
    }

    .card h2, .card h3 {
      margin-bottom: 15px;
      color: var(--dark-color);
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .kpi-card {
      background: white;
      padding: 20px;
      border-radius: var(--border-radius);
      box-shadow: var(--box-shadow);
      text-align: center;
    }

    .kpi-label {
      display: block;
      font-size: 0.875rem;
      color: var(--gray-500);
      margin-bottom: 8px;
    }

    .kpi-value {
      display: block;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--dark-color);
      margin-bottom: 5px;
    }

    .kpi-value.alert { color: var(--warning-color); }
    .kpi-value.danger { color: var(--danger-color); }

    .kpi-trend {
      font-size: 0.875rem;
      display: block;
    }

    .kpi-trend.up { color: var(--success-color); }
    .kpi-trend.down { color: var(--danger-color); }
    .kpi-trend.neutral { color: var(--gray-500); }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    .data-table th, .data-table td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid var(--gray-200);
    }

    .data-table th {
      background-color: var(--gray-100);
      font-weight: 600;
      color: var(--gray-500);
    }

    .data-table tr:hover { background-color: var(--gray-100); }

    .badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
    }

    .badge-success { background-color: rgba(72,187,120,0.15); color: #22c55e; }
    .badge-warning { background-color: rgba(245,158,11,0.15); color: #f59e0b; }
    .badge-danger { background-color: rgba(239,68,68,0.15); color: #ef4444; }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--gray-200);
      margin-bottom: 20px;
    }

    .tab {
      padding: 10px 20px;
      background: none;
      border: none;
      cursor: pointer;
      font-weight: 500;
      color: var(--gray-500);
      border-bottom: 2px solid transparent;
    }

    .tab.active {
      color: var(--primary-color);
      border-bottom: 2px solid var(--primary-color);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .module-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .module-header h2 { color: var(--dark-color); }

    .loading-spinner {
      text-align: center;
      padding: 40px;
      font-size: 1.2rem;
      color: var(--gray-500);
    }

    .mt-4 { margin-top: 1.5rem; }
    .mb-4 { margin-bottom: 1.5rem; }
    .flex { display: flex; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap-4 { gap: 1rem; }
    .w-full { width: 100%; }
    .text-center { text-align: center; }

    .activity-list { list-style: none; }
    .activity-list li {
      padding: 8px 0;
      border-bottom: 1px solid var(--gray-100);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .activity-list li:last-child { border-bottom: none; }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .dot.green { background-color: var(--success-color); }
    .dot.blue { background-color: var(--primary-color); }
    .dot.red { background-color: var(--danger-color); }
    .dot.gray { background-color: var(--gray-400); }

    .pl-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--gray-100);
    }

    .pl-row.total {
      font-weight: bold;
      font-size: 1.1rem;
      border-top: 2px solid var(--gray-200);
      border-bottom: none;
    }

    .search-bar {
      padding: 10px;
      border: 1px solid var(--gray-300);
      border-radius: var(--border-radius);
      width: 100%;
      margin-bottom: 15px;
    }

    @media (max-width: 768px) {
      .sidebar { width: 70px; }
      .sidebar .logo h1 span, .nav-link span { display: none; }
      .nav-link { justify-content: center; padding: 15px; }
      .main-content { margin-left: 70px; }
      .kpi-grid { grid-template-columns: 1fr; }
      .dash-grid-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="logo">
        <h1><span class="logo-icon">🦋</span> <span>Butterfly Dynamix</span></h1>
      </div>

      <ul class="nav-menu">
        <li class="nav-item"><a href="#" class="nav-link active" data-module="dashboard"><i>📊</i> <span>Dashboard</span></a></li>
        <li class="nav-item"><a href="#" class="nav-link" data-module="procurement"><i>🛒</i> <span>Procurement</span></a></li>
        <li class="nav-item"><a href="#" class="nav-link" data-module="sales"><i>💰</i> <span>Sales</span></a></li>
        <li class="nav-item"><a href="#" class="nav-link" data-module="inventory"><i>📦</i> <span>Inventory</span></a></li>
        <li class="nav-item"><a href="#" class="nav-link" data-module="finance"><i>🏦</i> <span>Finance</span></a></li>
        <li class="nav-item"><a href="#" class="nav-link" data-module="hr"><i>👥</i> <span>Human Resources</span></a></li>
        <li class="nav-item"><a href="#" class="nav-link" data-module="intelligence"><i>🧠</i> <span>AI Intelligence</span></a></li>
      </ul>
    </aside>

    <main class="main-content">
      <header class="top-header">
        <h1 class="page-title">ERP Dashboard</h1>
        <div class="user-actions">
          <button class="btn btn-secondary">Settings</button>
          <button class="btn btn-primary">Logout</button>
        </div>
      </header>

      <div id="app-content"></div>
    </main>
  </div>

  <script src="bookkeeping-app.js"></script>
</body>
</html>
